    <script>
      (function () {
        var DEFAULT_IMAGES = [
          "/images/_%20(7).jpeg",
          "images/_%20(8).jpg",
          "images/_%20(9).jpg",
          "images/nguyen%20thanh%20thuy.jpg",
          "images/yiking_s%20on%20Instagram.jpg"
        ];
        var container = document.getElementById("falling-images");
        if (!container) return;
        function rand(min, max) { return Math.random() * (max - min) + min; }
        function hexToRgb(hex) {
          var h = (hex || "").replace("#", "");
          if (h.length === 3) h = h.split("").map(function (c) { return c + c; }).join("");
          var n = parseInt(h, 16);
          return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
        }
        function readThemeColor() {
          try {
            var raw = document.getElementById("app").dataset.page;
            var c = JSON.parse(raw).props.client.color;
            return c || "#ff0019";
          } catch (e) { return "#ff0019"; }
        }
        function start() {
          attachTilt();
          if (!window.LOVEGIFT_IMAGES || window.LOVEGIFT_IMAGES.length === 0) {
            return;
          }
          var IMAGES = window.LOVEGIFT_IMAGES;
          var rgb = hexToRgb(readThemeColor());
          container.style.setProperty(
            "--glow-color",
            "rgba(" + rgb.r + "," + rgb.g + "," + rgb.b + ",0.85)"
          );
          function spawn() {
            var img = document.createElement("img");
            img.src = IMAGES[Math.floor(Math.random() * IMAGES.length)];
            img.className = "falling-img";
            img.alt = "";
            var size = rand(60, 130);
            img.style.width = size + "px";
            img.style.height = size + "px";
            img.style.left = rand(0, 100) + "vw";
            img.style.animationDuration = rand(7, 13) + "s";
            img.style.opacity = "0";
            img.addEventListener("animationend", function () { img.remove(); });
            container.appendChild(img);
          }
          for (var i = 0; i < 2; i++) setTimeout(spawn, i * 1200);
          setInterval(spawn, 2200);
        }
        function attachTilt() {
          var tiltX = 0, tiltY = 0;
          var dragging = false;
          var lastX = 0, lastY = 0;
          var MAX = 35;
          var SENS = 0.25;
          function apply() {
            container.style.transform =
              "rotateX(" + tiltX + "deg) rotateY(" + tiltY + "deg)";
          }
          function down(e) {
            var t = e.target;
            if (t && t.closest && t.closest("a[href*='lovegift']")) return;
            dragging = true;
            var p = e.touches ? e.touches[0] : e;
            lastX = p.clientX; lastY = p.clientY;
          }
          function move(e) {
            if (!dragging) return;
            var p = e.touches ? e.touches[0] : e;
            var dx = p.clientX - lastX;
            var dy = p.clientY - lastY;
            lastX = p.clientX; lastY = p.clientY;
            tiltY += dx * SENS;
            tiltX -= dy * SENS;
            if (tiltY > MAX) tiltY = MAX; else if (tiltY < -MAX) tiltY = -MAX;
            if (tiltX > MAX) tiltX = MAX; else if (tiltX < -MAX) tiltX = -MAX;
            apply();
          }
          function up() { dragging = false; }
          window.addEventListener("pointerdown", down, true);
          window.addEventListener("pointermove", move, true);
          window.addEventListener("pointerup", up, true);
          window.addEventListener("pointercancel", up, true);
          window.addEventListener("pointerleave", up, true);
        }
        if (window.__lovegiftConfigReady) start();
        else window.addEventListener("lovegift-ready", start, { once: true });
      })();
    </script>
    <script>
      (function () {
        var API_BASE = "https://lovegift.online/api/settings/";
        window.LOVEGIFT_IMAGES = null;

        function hideLoading() {
          var el = document.getElementById("lovegift-loading");
          if (!el) return;
          el.style.opacity = "0";
          setTimeout(function () { el.remove(); }, 400);
        }

        function showLoading() {
          var el = document.getElementById("lovegift-loading");
          if (el) el.style.display = "flex";
        }

        function applyConfig(cfg) {
          var app = document.getElementById("app");
          var pageData;
          try { pageData = JSON.parse(app.dataset.page); }
          catch (e) { console.error("Parse data-page failed:", e); return; }

          if (cfg.messages && cfg.messages.length > 0) {
            pageData.props.client.messages = cfg.messages;
          }
          if (cfg.images && cfg.images.length > 0) {
            window.LOVEGIFT_IMAGES = cfg.images;
          }
          if (cfg.music) {
            pageData.props.client.music = cfg.music;
          }
          if (cfg.color) {
            pageData.props.client.color = cfg.color;
          }
          app.dataset.page = JSON.stringify(pageData);
        }

        function startApp() {
          if (window.__lovegiftAppStarted) return;
          window.__lovegiftAppStarted = true;
          window.__lovegiftConfigReady = true;
          window.dispatchEvent(new Event("lovegift-ready"));
          var s1 = document.createElement("script");
          s1.type = "module";
          s1.src = "static/js/app.js";
          document.body.appendChild(s1);
          var s2 = document.createElement("script");
          s2.type = "module";
          s2.src = "static/js/home.js";
          document.body.appendChild(s2);
          hideLoading();
        }

        function enableEntrance() {
          window.__lovegiftConfigLoaded = true;
          hideLoading();
          var entrance = document.getElementById("lovegift-entrance");
          var button = document.getElementById("lovegift-enter");
          if (entrance) entrance.classList.add("is-ready");
          if (button) button.disabled = false;
        }

        function enterApp() {
          if (!window.__lovegiftConfigLoaded) return;
          var entrance = document.getElementById("lovegift-entrance");
          var button = document.getElementById("lovegift-enter");
          if (button) button.disabled = true;
          if (entrance) entrance.classList.add("is-leaving");
          startApp();
          setTimeout(function () {
            if (entrance) entrance.remove();
          }, 520);
        }

        var enterButton = document.getElementById("lovegift-enter");
        if (enterButton) enterButton.addEventListener("click", enterApp);

        var params = new URLSearchParams(window.location.search);
        var cfgId = params.get("id");

        if (cfgId) {
          showLoading();
          fetch(API_BASE + cfgId)
            .then(function (r) { return r.json(); })
            .then(function (data) {
              if (data.success && data.data && data.data.settings) {
                var s = data.data.settings;
                var cfg = {};
                if (s.arrayText && s.arrayText.length > 0) cfg.messages = s.arrayText;
                if (s.image && s.image.length > 0) cfg.images = s.image;
                if (s.music) cfg.music = s.music;
                if (s.color) cfg.color = s.color;
                applyConfig(cfg);
                console.log("Config loaded from API:", cfg);
              }
              enableEntrance();
            })
            .catch(function (err) {
              console.error("Lỗi load config từ API:", err);
              enableEntrance();
            });
        } else {
          enableEntrance();
        }
      })();
    </script>
