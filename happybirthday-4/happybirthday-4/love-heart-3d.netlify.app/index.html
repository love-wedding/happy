  <!--
    LOAD SETTINGS LOGIC
    Thứ tự ưu tiên:
      1. ?id=<cfgId>     -> fetch GET https://lovegift.online/api/settings/<cfgId>
      2. ?c=<base64url>  -> pako.inflate + JSON.parse (gói gọn nhiều field)
      3. ?title=&music=&messages=&image=&popupMessage=&heartColor=  (param thường)
      4. ?data=<base64>  -> giữ NGUYÊN logic cũ trong scripts.js (không động vào)

    API response shape: data.data.settings = {
      arrayText:  string[]   -> messages (mảng câu chữ bay lên)
      image:      string[]   -> images   (mảng URL ảnh; [] -> ẩn ảnh trong popup)
      heartColor: "#rrggbb"  -> heartColor (màu trái tim 3D)
      music:      url        -> music / backgroundMusic
      uploadedTikTokMusics: [...]  // KHÔNG dùng — chỉ là thư viện nhạc của user
    }
    Lưu ý: API hiện không trả về `title` và `message`/`popupMessage`
           -> dùng default; vẫn đọc optional `s.title` / `s.message` để tương thích nếu sau này API bổ sung.
  -->
  <script>
    function decodeData(encodedString) {
      try {
        let base64 = encodedString.replace(/-/g, '+').replace(/_/g, 'index.html');
        while (base64.length % 4) base64 += '=';
        const binaryString = atob(base64);
        const bytes = new Uint8Array(binaryString.length);
        for (let i = 0; i < binaryString.length; i++) {
          bytes[i] = binaryString.charCodeAt(i);
        }
        const decompressed = pako.inflate(bytes, { to: 'string' });
        return JSON.parse(decompressed);
      } catch (e) {
        console.error("Lỗi khi giải mã dữ liệu:", e);
        return null;
      }
    }

    function getUrlParameter(name) {
      const urlParams = new URLSearchParams(window.location.search);
      const compressedContent = urlParams.get("c");
      if (compressedContent) {
        const content = decodeData(compressedContent);
        if (content) {
          if (name === "title" && content.title) return content.title;
          if (name === "music" && content.music) return content.music;
          if (name === "messages" && content.messages) return content.messages;
          if (name === "image" && content.image) return content.image;
          if (name === "popupMessage" && content.popupMessage) return content.popupMessage;
          if (name === "heartColor" && content.heartColor) return content.heartColor;
        }
      }
      const regularParam = urlParams.get(name);
      if (regularParam) return decodeURIComponent(regularParam);
      return null;
    }

    const defaultData = {
      template: "valentine-heart",
      data: {
        title: "Yêu Em 💖",
        type_music: "link",
        music_id: "https://cdn.shopify.com/s/files/1/0757/9700/4572/files/Download_1.mp3?v=1788885458",
        backgroundMusic: "https://cdn.shopify.com/s/files/1/0757/9700/4572/files/Download_1.mp3?v=1788885458",
        popupMessage: "💖 Gửi đến em người anh thương nhất! 💝 Cảm ơn em đã đến bên anh, cùng anh đi qua những ngày tháng đẹp nhất. Anh yêu em thật nhiều, mãi mãi bên nhau em nhé! 💕💗💞",
        messages: [
          "Anh yêu em nhiều lắm! 💖💝",
          "Mãi mãi bên em! 💗💕",
          "Em là cả thế giới của anh! 💞💓"
        ],
        images: ["image1.jpeg", "image2.jpg", "image3.jpeg"],
        heartColor: "#fd9595"
      }
    };

    function initWithData(settings) {
      const music = settings.music || defaultData.data.backgroundMusic;
      const popupMessage = settings.message || settings.popupMessage || defaultData.data.popupMessage;
      // Chỉ chuyển cảnh sang envelope khi config có sẵn nội dung message.
      window._hasEnvelopeMessage = !!(settings.message || settings.popupMessage);
      const messages = settings.messages
        ? (Array.isArray(settings.messages) ? settings.messages : settings.messages.split(',').map(function (m) { return m.trim(); }))
        : defaultData.data.messages;

      let noImage = false;
      let images;
      if (Array.isArray(settings.image) && settings.image.length === 0) {
        images = [];
        noImage = true;
      } else if (settings.image) {
        images = Array.isArray(settings.image)
          ? settings.image
          : settings.image.split(',').map(function (m) { return m.trim(); });
      } else {
        images = defaultData.data.images;
      }
      const title = settings.title || defaultData.data.title;
      // Chỉ chấp nhận màu hex hợp lệ; ngược lại fallback default
      const heartColor = (typeof settings.heartColor === 'string' && /^#([A-Fa-f0-9]{6}|[A-Fa-f0-9]{8})$/.test(settings.heartColor))
        ? settings.heartColor
        : defaultData.data.heartColor;

      window.dataChristmasTree = {
        template: defaultData.template,
        data: {
          title: title,
          type_music: defaultData.data.type_music,
          music_id: music,
          backgroundMusic: music,
          popupMessage: popupMessage,
          messages: messages,
          images: images,
          heartColor: heartColor
        }
      };

      window.Heartlove = {
        data: {
          popupMessage: popupMessage,
          messages: messages,
          images: images,
          heartColor: heartColor,
          music: music
        }
      };

      window.dataValentine = {
        data: {
          messages: messages,
          images: images,
          captions: [],
          heartColor: heartColor,
          music: music
        }
      };

      const popupTitle = document.getElementById('popup-title');
      if (popupTitle && title) {
        popupTitle.innerHTML = title + '<span class="heart-icon">💘</span>';
      }

      const popupImage = document.getElementById('popup-image');
      if (noImage) {
        const popupImageContainer = popupImage && popupImage.closest('.popup-image-container');
        if (popupImageContainer) popupImageContainer.style.display = 'none';
        window._noImageFromApi = true;
      } else if (popupImage && images && images.length > 0) {
        popupImage.src = images[0];
      }

      console.log("Dữ liệu đã load:", window.Heartlove);
    }

    (function () {
      const urlParams = new URLSearchParams(window.location.search);
      const cfgId = urlParams.get('id');

      // Nếu có ?data= -> giữ NGUYÊN luồng cũ trong scripts.js, không init ở đây
      if (urlParams.get('data')) return;

      if (cfgId) {
        window._heartloveReady = new Promise(function (resolve) {
          fetch('https://lovegift.online/api/settings/' + cfgId)
            .then(function (r) { return r.json(); })
            .then(function (data) {
              if (data.success && data.data && data.data.settings) {
                const s = data.data.settings;
                const hasImage = s.image && (Array.isArray(s.image) ? s.image.length > 0 : s.image.trim() !== '');
                initWithData({
                  music: s.music || null,
                  popupMessage: s.message || null,         // optional — API hiện chưa trả
                  messages: s.arrayText || null,
                  image: hasImage ? s.image : [],
                  title: s.title || null,                  // optional — API hiện chưa trả
                  heartColor: s.heartColor || null,
                  fromApi: true
                });
              } else {
                initWithData({ image: [], fromApi: true });
              }
              resolve();
            })
            .catch(function () {
              initWithData({ image: [], fromApi: true });
              resolve();
            });
        });
      } else {
        // Nếu có ?c= và pako chưa load (defer), đợi DOMContentLoaded rồi mới decode
        const needsPako = !!urlParams.get('c');
        const runInit = () => initWithData({
          music: getUrlParameter("music"),
          popupMessage: getUrlParameter("popupMessage"),
          messages: getUrlParameter("messages"),
          image: getUrlParameter("image"),
          title: getUrlParameter("title"),
          heartColor: getUrlParameter("heartColor")
        });
        if (needsPako && !window.pako) {
          window._heartloveReady = new Promise(function (resolve) {
            document.addEventListener('DOMContentLoaded', function () {
              runInit();
              resolve();
            }, { once: true });
          });
        } else {
          runInit();
        }
      }
    })();
  </script>
