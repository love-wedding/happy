<body>
    <!-- Loading overlay — chỉ hiện khi đang fetch config từ API -->
    <div id="loading-overlay" class="hidden" aria-hidden="true">
        <div class="loading-heart">💝</div>
        <div class="loading-title">Đang chuẩn bị quà cho bạn...</div>
        <div class="loading-bar">
            <div id="loading-progress" class="loading-progress"></div>
        </div>
        <div id="loading-percent" class="loading-percent">0%</div>
    </div>
    <div id="intro__cube">
        <div class="intro__title"><span class="intro__title-text">Happy birthday bé iu</span></div>
        <div class="cube" id="cube__trigger">
            <div class="outer-cube">
                <div class="outer-top"><img src="birthdaygirl/girl1.jpg" alt=""></div>
                <div class="outer-bottom"><img src="birthdaygirl/girl2.jpg" alt=""></div>
                <div class="outer-front"><img src="birthdaygirl/girl3.jpg" alt=""></div>
                <div class="outer-back"><img src="birthdaygirl/girl4.jpg" alt=""></div>
                <div class="outer-left"><img src="birthdaygirl/girl5.jpg" alt=""></div>
                <div class="outer-right"><img src="birthdaygirl/girl6.jpg" alt=""></div>
            </div>
            <div class="inner-cube">
                <div class="inner-top"><img src="birthdaygirl/girl4.jpg" alt=""></div>
                <div class="inner-bottom"><img src="birthdaygirl/girl5.jpg" alt=""></div>
                <div class="inner-front"><img src="birthdaygirl/girl6.jpg" alt=""></div>
                <div class="inner-back"><img src="birthdaygirl/girl1.jpg" alt=""></div>
                <div class="inner-left"><img src="birthdaygirl/girl2.jpg" alt=""></div>
                <div class="inner-right"><img src="birthdaygirl/girl3.jpg" alt=""></div>
            </div>
        </div>
    </div>

    <div id="wrapper">
        <div class="flag__birthday">
            <img src="images/1.png" alt="" class="flag__left">
            <img src="images/1.png" alt="" class="flag__right">
        </div>
        <div class="content">
            <div class="left">
                <div class="title">
                    <h1 class="happy">
                        <span style="--t: 0s;">H</span>
                        <span style="--t: 0.15s;">a</span>
                        <span style="--t: 0.3s;">p</span>
                        <span style="--t: 0.45s;">p</span>
                        <span style="--t: 0.6s;">y</span>
                    </h1>
                    <h1 class="birthday">
                        <span style="--t: 0.75s;">B</span>
                        <span style="--t: 0.9s;">i</span>
                        <span style="--t: 1.05s;">r</span>
                        <span style="--t: 1.2s;">t</span>
                        <span style="--t: 1.35s;">h</span>
                        <span style="--t: 1.5s;">d</span>
                        <span style="--t: 1.65s;">a</span>
                        <span style="--t: 1.8s;">y</span>
                    </h1>
                    <div class="hat">
                        <img src="images/hat.png" alt="">
                    </div>
                </div>
                <div id="cake-stage" class="cake-stage"></div>
                <div class="cake-controls">
                    <button id="cake-blow-btn" class="cake-blow-btn" type="button" aria-hidden="true" disabled>🔥 Thổi nến</button>
                    <div id="cake-cut-reminder" class="cake-cut-reminder" hidden>Vuốt xuyên qua bánh <strong>3 nhát</strong> để cắt — <span id="cake-cut-counter">0/3</span></div>
                </div>
                <div class="btn" hidden>
                    <button id="btn__letter">
                        Click here Rashmii
                        <i class="fa-regular fa-envelope"></i>
                    </button>
                </div>
            </div>
        </div>
        <div class="decorate_star star1" style="--t: 15s;"></div>
        <div class="decorate_star star2" style="--t: 15.2s;"></div>
        <div class="decorate_star star3" style="--t: 15.4s;"></div>
        <div class="decorate_star star4" style="--t: 15.6s;"></div>
        <div class="decorate_star star5" style="--t: 15.8s;"></div>
        <div class="decorate_flower--one" style="--t: 15s;">
            <img width="20" src="images/decorate_flower.png" alt="">
        </div>
        <div class="decorate_flower--two" style="--t: 15.3s;">
            <img width="20" src="images/decorate_flower.png" alt="">
        </div>
        <div class="decorate_flower--three" style="--t: 15.6s;">
            <img width="20" src="images/decorate_flower.png" alt="">
        </div>
        <img class="corner corner--bottom-left" src="icons/3.png" alt="">
        <img class="corner corner--bottom-right" src="icons/3.png" alt="">
        <div class="bg__icon bg__icon--lips">
            <img src="icons/1.png" alt="">
        </div>
        <div class="bg__icon bg__icon--stars">
            <img src="icons/2.png" alt="">
        </div>
        <div class="bg__icon bg__icon--heart">
            <img src="icons/5.png" alt="">
        </div>
        <div class="bg__icon bg__icon--6"><img src="icons/6.png" alt=""></div>
        <div class="bg__icon bg__icon--7"><img src="icons/7.png" alt=""></div>
        <div class="bg__icon bg__icon--8"><img src="icons/8.png" alt=""></div>
        <div class="bg__icon bg__icon--9"><img src="icons/9.png" alt=""></div>
        <div class="bg__icon bg__icon--10"><img src="icons/10.png" alt=""></div>
        <div class="bg__icon bg__icon--11"><img src="icons/11.png" alt=""></div>
        <div class="bg__icon bg__icon--12"><img src="icons/12.png" alt=""></div>



        <div class="box__letter">
            <div class="letter__border">
                <div class="letter">
                    <div class="letter__header">
                        <h2 class="happy-bday">
                            <span class="happy-bday__big"></span>
                        </h2>
                    </div>
                    <div class="letter__body">
                        <div class="letter__image">
                            <img src="birthdaygirl/girl1.jpg" alt="">
                        </div>
                        <div class="letter__content">
                            <div class="text__letter">
                                <p></p>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="close">
                    <i class="fa-solid fa-xmark"></i>
                </div>
            </div>
        </div>

        <!-- SVG filter cho mép giấy răng cưa -->
        <svg style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
            <defs>
                <filter id="paper-torn-edges" x="-5%" y="-5%" width="110%" height="110%">
                    <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5" result="noise"/>
                    <feDisplacementMap in="SourceGraphic" in2="noise" scale="10"/>
                </filter>
            </defs>
        </svg>
        <audio id="bg-music" loop preload="auto" style="display:none"></audio>
    </div>
</body>
